<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow — Organize your day</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">

    <!-- Header -->
    <header class="app-header">
      <div class="header-brand">
        <div class="logo-mark" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 12.5L9.5 17L19 7" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>TaskFlow</h1>
          <p class="tagline">Organize your day. Get things done.</p>
        </div>
      </div>

      <div class="header-actions">
        <span class="task-count-pill" id="taskCountPill">0 tasks</span>
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark mode" aria-pressed="false">
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.8"/>
            <path d="M12 2.5V5M12 19V21.5M21.5 12H19M5 12H2.5M18.4 5.6L16.7 7.3M7.3 16.7L5.6 18.4M18.4 18.4L16.7 16.7M7.3 7.3L5.6 5.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="app-main">

      <!-- Stats dashboard -->
      <section class="stats-grid" aria-label="Task statistics">
        <div class="stat-card">
          <div class="stat-icon stat-icon-total" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </div>
          <div class="stat-info">
            <span class="stat-value" id="statTotal">0</span>
            <span class="stat-label">Total tasks</span>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon stat-icon-done" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 12.5L9.5 17L19 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div class="stat-info">
            <span class="stat-value" id="statCompleted">0</span>
            <span class="stat-label">Completed</span>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon stat-icon-pending" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="2"/><path d="M12 7.5V12l3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </div>
          <div class="stat-info">
            <span class="stat-value" id="statPending">0</span>
            <span class="stat-label">Pending</span>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon stat-icon-priority" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 3v12M12 15l-4-4M12 15l4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 20h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </div>
          <div class="stat-info">
            <span class="stat-value" id="statHighPriority">0</span>
            <span class="stat-label">High priority</span>
          </div>
        </div>
      </section>

      <!-- Toolbar: search, filters, sort, add task -->
      <section class="toolbar" aria-label="Task filters and actions">
        <div class="search-wrap">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input type="search" id="searchInput" placeholder="Search tasks…" aria-label="Search tasks" />
        </div>

        <div class="filter-group" role="group" aria-label="Filter by status">
          <button class="filter-chip is-active" data-filter="all" type="button">All</button>
          <button class="filter-chip" data-filter="active" type="button">Active</button>
          <button class="filter-chip" data-filter="completed" type="button">Completed</button>
        </div>

        <select id="priorityFilter" class="select-input" aria-label="Filter by priority">
          <option value="all">All priorities</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>

        <select id="sortSelect" class="select-input" aria-label="Sort tasks">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="dueDate">Due date</option>
          <option value="priority">Priority</option>
        </select>

        <button class="btn-primary" id="openAddTaskBtn" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
          New task
        </button>
      </section>

      <!-- Task list -->
      <section class="task-list-section" aria-label="Tasks">
        <div id="loadingState" class="loading-state" hidden>
          <div class="spinner" aria-hidden="true"></div>
          <p>Loading your tasks…</p>
        </div>

        <div id="emptyState" class="empty-state" hidden>
          <div class="empty-illustration" aria-hidden="true">
            <svg width="72" height="72" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="4" y="4" width="16" height="16" rx="4" stroke="currentColor" stroke-width="1.4" opacity="0.5"/>
              <path d="M8.5 12.5l2.3 2.3L16 9.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <h2 id="emptyStateTitle">No tasks yet</h2>
          <p id="emptyStateMessage">Add your first task and start building momentum.</p>
          <button class="btn-primary" id="emptyStateAddBtn" type="button">Create your first task</button>
        </div>

        <ul class="task-list" id="taskList" aria-live="polite"></ul>
      </section>
    </main>
  </div>

  <!-- Add / Edit Task modal -->
  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <h2 id="modalTitle">New task</h2>
        <button class="icon-btn" id="closeModalBtn" type="button" aria-label="Close">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>

      <form id="taskForm" class="task-form" novalidate>
        <input type="hidden" id="taskId" />

        <div class="field">
          <label for="titleInput">Title <span class="required">*</span></label>
          <input type="text" id="titleInput" name="title" placeholder="e.g. Prepare client presentation" maxlength="120" required />
          <span class="field-error" id="titleError"></span>
        </div>

        <div class="field">
          <label for="descriptionInput">Description</label>
          <textarea id="descriptionInput" name="description" rows="3" placeholder="Add more detail (optional)" maxlength="500"></textarea>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="priorityInput">Priority</label>
            <select id="priorityInput" name="priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>

          <div class="field">
            <label for="dueDateInput">Due date</label>
            <input type="date" id="dueDateInput" name="dueDate" />
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="cancelModalBtn">Cancel</button>
          <button type="submit" class="btn-primary" id="submitTaskBtn">Add task</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete confirmation modal -->
  <div class="modal-overlay" id="confirmOverlay" hidden>
    <div class="modal-panel modal-panel-small" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle">
      <div class="modal-header">
        <h2 id="confirmTitle">Delete task?</h2>
        <button class="icon-btn" id="closeConfirmBtn" type="button" aria-label="Close">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <p class="confirm-message" id="confirmMessage">This can't be undone. Are you sure you want to delete this task?</p>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancelDeleteBtn">Cancel</button>
        <button type="button" class="btn-danger" id="confirmDeleteBtn">Delete</button>
      </div>
    </div>
  </div>

  <!-- Toast container -->
  <div class="toast-container" id="toastContainer" aria-live="polite" aria-atomic="true"></div>

  <script src="js/app.js"></script>
</body>
</html>
